    <style>
      /* Initial High-Definition Splash Loader before React Mounts */
      #initial-loader {
        position: fixed;
        inset: 0;
        background: #F4F6F4;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        font-family: 'Noto Sans Devanagari', 'Noto Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        color: #0F2942;
        border-top: 5px solid #FF9933;
        padding: 20px;
        box-sizing: border-box;
      }
      .loader-emblem {
        width: 84px;
        height: 84px;
        background: #14532D;
        border: 3.5px solid #FF9933;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        box-shadow: 0 10px 25px rgba(20, 83, 45, 0.25);
        margin-bottom: 18px;
        animation: pulseLogo 2s infinite ease-in-out;
      }
      .loader-badge {
        font-size: 11px;
        font-weight: 800;
        color: #14532D;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        background: #E8F5E9;
        border: 1px solid #A5D6A7;
        padding: 4px 12px;
        border-radius: 20px;
        margin-bottom: 8px;
        display: inline-block;
      }
      .loader-title {
        font-size: 26px;
        font-weight: 800;
        color: #0F2942;
        margin: 0 0 6px 0;
        letter-spacing: -0.3px;
        text-align: center;
      }
      .loader-sub {
        font-size: 13.5px;
        color: #4A564E;
        margin: 0 0 22px 0;
        text-align: center;
        font-weight: 500;
        max-width: 480px;
        line-height: 1.5;
      }
      .loader-spinner {
        width: 38px;
        height: 38px;
        border: 3.5px solid #CBD5E1;
        border-top-color: #15803D;
        border-right-color: #FF9933;
        border-radius: 50%;
        animation: spinLoader 0.9s linear infinite;
        margin-bottom: 16px;
      }
      .loader-status {
        font-size: 13px;
        font-weight: 600;
        color: #15803D;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .loader-footer {
        position: absolute;
        bottom: 16px;
        font-size: 11.5px;
        color: #64748B;
        text-align: center;
      }
      @keyframes spinLoader {
        to { transform: rotate(360deg); }
      }
      @keyframes pulseLogo {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
    </style>
  </head>
  <body class="bg-[#F4F6F4] text-[#1E293B] antialiased">

        Please enable JavaScript in your browser to run Krishi Rakshak AI Portal.

    <div id="root">

          भारत सरकार | कृषि एवं किसान कल्याण मंत्रालय
        </div>
        <h1 class="loader-title">कृषि रक्षक (CropGuard AI)</h1>
        <p class="loader-sub">National Crop Disease & Pest Advisory Portal (92 Indian Crops & ICAR Certified Guidance)</p>
        <div class="loader-spinner"></div>
        <div class="loader-status">
          <span>पोर्टल लोड हो रहा है... कृपया प्रतीक्षा करें</span>
        </div>
        <div class="loader-footer">
          किसान कॉल सेंटर (निःशुल्क): 1800-180-1551 | ICAR & KVK समर्थित
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
